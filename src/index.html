<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Complementary Chat Tool
    </title>

    <link
        rel="stylesheet"
        href="styles.css">

    <script
        type="module"
        src="/js/main.js"
        defer>
    </script>
</head>

<body>
    <main class="container">
        <h1>
            Complementary Chat Tool
        </h1>
        <details class="settings-panel">
          <summary>
              Configuration
          </summary>
          <div class="settings-content">

              <label for="endpoint-url">
                  Endpoint URL
              </label>

              <input
                  id="endpoint-url"
                  type="text"
                  placeholder="https://provider.example.com/v1/chat/completions">

              <label for="api-key">
                  API Key
              </label>

              <input
                  id="api-key"
                  type="password">

              <label for="model-name">
                  Model Name
              </label>

              <input
                  id="model-name"
                  type="text"
                  placeholder="gpt-5">

              <label>
                    Memory
                </label>

                <div class="memory-settings">
                    <label class="checkbox-label">
                        <input
                            type="checkbox"
                            id="unlimited-memory">
                        Unlimited memory (Iterations)
                    </label>

                    <input
                        id="memory-limit"
                        type="number"
                        min="0"
                        step="1"
                        value="40">
                        <small class="memory-hint">
                        (0 = no memory)
                        </small>
              </div>
              <label for="instructions">
                  AI instructions
              </label>

              <textarea
                  id="instructions"
                  rows="6"
                  placeholder="Write here the instructions for the model"></textarea>

              <button id="save-btn">
                    Save Configuration
                </button>
                
          </div>
        </details>
        <section
            id="chat"
            class="chat">
        </section>

        <div class="chat-actions">
            <button id="copy-btn">
                Copy AI Response
            </button>
        </div>

        <section class="prompt-box">
            <textarea
                id="prompt"
                rows="3"
                placeholder="Write here"></textarea>

            <button id="send-btn">
                Send
            </button>
        </section>
    </main>
</body>
</html>
