<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Complementary Chat Tool
    </title>

    <link
        rel="stylesheet"
        href="styles.css">

    <script
        type="module"
        src="/js/main.js"
        defer>
    </script>
</head>

<body>
    <main class="container">
        <h1>
            Complementary Chat Tool
        </h1>
        <details class="settings-panel">
          <summary>
              Configuration
          </summary>
          <div class="settings-content">

              <label for="endpoint-url">
                  Endpoint URL
              </label>

              <input
                  id="endpoint-url"
                  type="text"
                  placeholder="https://api.openai.com/v1/chat/completions">

              <label for="api-key">
                  API Key
              </label>

              <input
                  id="api-key"
                  type="password">

              <label for="model-name">
                  Model Name
              </label>

              <input
                  id="model-name"
                  type="text"
                  placeholder="gpt-5">

              <label for="instructions">
                  AI instructions
              </label>

              <textarea
                  id="instructions"
                  rows="6"
                  placeholder="Write here the instructions for the model"></textarea>
          </div>
        </details>
        <section
            id="chat"
            class="chat">
        </section>

        <section class="prompt-box">
            <textarea
                id="prompt"
                rows="3"
                placeholder="Write here"></textarea>

            <button id="send-btn">
                Send
            </button>
        </section>
    </main>
</body>
</html>
